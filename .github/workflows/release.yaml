name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write       # GHCR push
  id-token: write       # OIDC keyless cosign signing
  attestations: write   # SLSA build provenance for the image

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/refusehq/refuse:${{ steps.meta.outputs.version }}
            ghcr.io/refusehq/refuse:latest
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/refusehq/refuse@${DIGEST} \
            ghcr.io/refusehq/refuse:${{ steps.meta.outputs.version }} \
            ghcr.io/refusehq/refuse:latest

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/refusehq/refuse
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
