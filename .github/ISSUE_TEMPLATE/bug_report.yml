name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please search [existing issues](https://github.com/RefuseHQ/refuse/issues?q=is%3Aissue) to avoid duplicates.

        If the bug is a **security issue**, please do not file it here — see [SECURITY.md](https://github.com/RefuseHQ/refuse/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of what went wrong, including the exact command or request you made.
      placeholder: |
        I ran `curl -X POST http://localhost:8080/api/v1/check/package -d ...` and got ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. The fewer the better.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: refuse version
      description: Output of `curl http://localhost:8080/healthz` (it includes the version), or the image tag you're running.
      placeholder: "ghcr.io/refusehq/refuse:v0.0.1"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running refuse?
      options:
        - Docker (single container)
        - Docker Compose
        - From source (pnpm dev)
        - From source (built binary)
        - Kubernetes
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs from around the time of the issue, redacted of any secrets.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/RefuseHQ/refuse/blob/main/CODE_OF_CONDUCT.md).
          required: true
