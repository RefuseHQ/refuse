version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      # Groups bundle ONLY patch + minor — majors get individual PRs.
      # A grouped major-bump PR ends up with multiple breaking changes
      # rolled into one diff that's hard to review or revert.
      types:
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
    ignore:
      # Node odd-major releases are the Current line, not LTS. We pin to
      # LTS only (24 → 26 → 28 …); odd majors also drop corepack from the
      # slim image and break our build. Ignore them explicitly so
      # Dependabot doesn't keep proposing 25, 27, 29 every release.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x", "31.x", "33.x"]
